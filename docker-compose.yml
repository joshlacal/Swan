name: swan-interop-alpha

# Launch only through ./interop/compose.sh. The wrapper validates the pinned
# reference archive before Docker receives a build context. Secret values come
# exclusively from owner-only files below SWAN_INTEROP_SECRETS_DIR; Compose
# interpolates only that directory path, never a secret value.
services:
  swan-secrets-init:
    build:
      context: ..
      dockerfile: Swan/Dockerfile
    user: root
    entrypoint: ["/usr/local/bin/swan-interop-prepare-secrets"]
    environment:
      EXTERNAL_SECRETS_DIR: /external-secrets
      SWAN_RUNTIME_SECRETS_DIR: /prepared/swan-runtime
      SWAN_BOOTSTRAP_SECRETS_DIR: /prepared/swan-bootstrap
      REFERENCE_PDS_SECRETS_DIR: /prepared/reference-pds
    volumes:
      - ${SWAN_INTEROP_SECRETS_DIR:?set the owner-only lab interop secret directory path}:/external-secrets:ro
      - swan-runtime-secrets:/prepared/swan-runtime
      - swan-bootstrap-secrets:/prepared/swan-bootstrap
      - reference-pds-secrets:/prepared/reference-pds
    network_mode: "none"
    restart: "no"

  swan-data-init:
    build:
      context: ..
      dockerfile: Swan/Dockerfile
    user: root
    entrypoint: ["/bin/sh", "-ec"]
    # The entrypoint is `sh -ec`; keep the complete script in one argument so
    # Compose does not split `install` flags into `$0`/`$1` shell parameters.
    command: ["install -d -o swan -g swan -m 0700 /var/lib/swan/data"]
    volumes:
      - swan-data:/var/lib/swan
    network_mode: "none"
    restart: "no"

  swan-bootstrap:
    build:
      context: ..
      dockerfile: Swan/Dockerfile
    user: swan
    entrypoint: ["/usr/local/bin/swan-interop-bootstrap"]
    command: []
    environment:
      DATA_DIRECTORY: /var/lib/swan/data
      SWAN_INTEROP_SECRETS_DIR: /run/secrets/swan-bootstrap
    volumes:
      - swan-data:/var/lib/swan
      - swan-bootstrap-secrets:/run/secrets/swan-bootstrap:ro
    depends_on:
      swan-secrets-init:
        condition: service_completed_successfully
      swan-data-init:
        condition: service_completed_successfully
      reference-plc:
        condition: service_healthy
    networks:
      swan:
        ipv4_address: 172.30.0.6
    restart: "no"

  swan:
    build:
      context: ..
      dockerfile: Swan/Dockerfile
    user: swan
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    command:
      - serve
      - --host
      - "0.0.0.0"
      - --port
      - "3000"
      - --public-url
      - "https://swan.test"
      - --profile
      - /usr/local/share/swan/Profiles/permissioned-data-0016-2026-07-30.json
      - --data-directory
      - /var/lib/swan/data
      - --enable-local-space-interop
      - --space-account-kek-file
      - /run/secrets/swan-runtime/account-kek
      - --space-account-kek-id
      - primary
      - --enable-public-repository-mutations
      - --public-account-kek-file
      - /run/secrets/swan-runtime/account-kek
      - --public-account-kek-id
      - primary
      - --oauth-server-key-file
      - /run/secrets/swan-runtime/oauth-server-key
      - --enable-oauth-authorization-server
      - --oauth-allow-localhost-development-client
      - --login-trusted-proxy-peer
      - "172.30.0.2"
      # This checked-in file contains only disposable lab routing and public
      # verification configuration. Secrets remain in the prepared volumes.
      - --notification-config
      - /etc/swan/interop/notification-config.json
      - --enable-notification-delivery
      - --managing-service-audience
      - did:web:interop-swan-managing-service
      - --enable-email-recovery
      - --email-proof-key-file
      - /run/secrets/swan-runtime/email-proof-key
      - --email-sender
      - no-reply@swan.local
      - --email-smtp-host
      - mailpit
      - --email-smtp-port
      - "1025"
    volumes:
      - swan-data:/var/lib/swan
      - swan-runtime-secrets:/run/secrets/swan-runtime:ro
    networks:
      swan:
        ipv4_address: 172.30.0.5
    depends_on:
      swan-bootstrap:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error --max-time 2 http://127.0.0.1:3000/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12

  reference-pds:
    build:
      context: ..
      dockerfile: Swan/interop/Dockerfile.reference-pds
    environment:
      PDS_HOSTNAME: pds.test
      PDS_PORT: "3000"
      PDS_DATA_DIRECTORY: /pds
      PDS_BLOBSTORE_DISK_LOCATION: /pds/blocks
      PDS_DID_PLC_URL: http://reference-plc:2582
      PDS_INVITE_REQUIRED: "true"
      PDS_DISABLE_SSRF_PROTECTION: "false"
      LOG_ENABLED: "false"
      REFERENCE_PDS_SECRETS_DIR: /run/secrets/reference-pds
    volumes:
      - reference-pds-data:/pds
      - reference-pds-secrets:/run/secrets/reference-pds:ro
    networks:
      swan:
        ipv4_address: 172.30.0.4
    depends_on:
      swan-secrets-init:
        condition: service_completed_successfully
      reference-plc:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/xrpc/_health').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 24

  # The PLC package is pinned by the same reference lockfile as the PDS. It is
  # private to the lab network; Caddy exposes no PLC route.
  reference-plc:
    build:
      context: ..
      dockerfile: Swan/interop/Dockerfile.reference-plc
    environment:
      PORT: "2582"
      LOG_ENABLED: "false"
    networks:
      swan:
        ipv4_address: 172.30.0.3
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:2582/_health').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 24

  caddy:
    build:
      context: ..
      dockerfile: Swan/interop/Dockerfile.caddy
    ports:
      - "127.0.0.1:443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks:
      swan:
        ipv4_address: 172.30.0.2
        aliases:
          - swan.test
          - pds.test
    depends_on:
      swan:
        condition: service_healthy
      toxiproxy-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "test -s /data/caddy/pki/authorities/local/root.crt"]
      interval: 1s
      timeout: 1s
      retries: 60

  caddy-ca-ready:
    build:
      context: ..
      dockerfile: Swan/Dockerfile
    user: root
    entrypoint: ["/usr/local/bin/swan-interop-caddy-trust"]
    volumes:
      - caddy-data:/caddy-data:ro
      - caddy-trust:/prepared-trust
    network_mode: "none"
    depends_on:
      caddy:
        condition: service_healthy
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.27.1@sha256:986b14ff7b253e62883ea19fd3112806f116e5e2f221e03f12fb81c7312ff532
    networks:
      swan:
        ipv4_address: 172.30.0.7
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1:8025/api/v1/info"]
      interval: 2s
      timeout: 2s
      retries: 30

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0@sha256:9378ed52a28bc50edc1350f936f518f31fa95f0d15917d6eb40b8e376d1a214e
    # Reserve a non-Caddy address. Without an explicit address Docker may
    # allocate Caddy's fixed 172.30.0.2 while Caddy is still waiting on the
    # healthy dependency graph, making the later Caddy start fail with an
    # address-in-use error.
    networks:
      swan:
        ipv4_address: 172.30.0.8

  toxiproxy-setup:
    image: curlimages/curl:8.13.0@sha256:d43bdb28bae0be0998f3be83199bfb2b81e0a30b034b6d7586ce7e05de34c3fd
    command:
      - /bin/sh
      - -ec
      - |
        until curl --fail --silent http://toxiproxy:8474/version >/dev/null; do sleep 1; done
        curl --fail --silent --show-error -X POST http://toxiproxy:8474/proxies \
          -H 'Content-Type: application/json' \
          --data '{"name":"reference-pds","listen":"0.0.0.0:8666","upstream":"reference-pds:3000","enabled":true}' \
          || curl --fail --silent http://toxiproxy:8474/proxies/reference-pds >/dev/null
    networks:
      swan:
        ipv4_address: 172.30.0.9
    depends_on:
      toxiproxy:
        condition: service_started
      reference-pds:
        condition: service_healthy
    restart: "no"

  # Task 28 deliberately does not execute the cross-host matrix. This profile
  # is an inert trust-handoff proof: it has no network and never invokes Swan.
  scenario-runner:
    profiles: ["planned-not-executed"]
    build:
      context: ..
      dockerfile: Swan/Dockerfile
    user: swan
    entrypoint: ["/bin/sh", "-ec"]
    command: >
      test -r /etc/ssl/certs/caddy-local-root.crt
      && test "$(head -n 1 /etc/ssl/certs/caddy-local-root.crt)" = "-----BEGIN CERTIFICATE-----"
      && SSL_CERT_FILE=/etc/ssl/certs/caddy-local-root.crt
      && export SSL_CERT_FILE
      && echo "planned-not-executed: CA trust prepared; no probes or faults were run"
    volumes:
      - caddy-trust:/etc/ssl/certs:ro
    network_mode: "none"
    depends_on:
      caddy-ca-ready:
        condition: service_completed_successfully
    restart: "no"

volumes:
  swan-data:
  swan-runtime-secrets:
  swan-bootstrap-secrets:
  reference-pds-data:
  reference-pds-secrets:
  caddy-data:
  caddy-config:
  caddy-trust:

networks:
  swan:
    ipam:
      config:
        - subnet: 172.30.0.0/24
