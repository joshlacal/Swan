[package]
name = "swan-vault"
version = "0.1.0"
edition = "2021"
description = "Boring durable object + SQLite-WAL segment store for SwanTV, runs on an OpenWrt router"
license = "MIT"

[dependencies]
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
subtle = "2"
parking_lot = "0.12"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
