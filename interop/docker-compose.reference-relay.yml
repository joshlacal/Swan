# Optional Phase 5 laboratory topology. It is always passed after the base
# file, and is never loaded by ./interop/compose.sh.
services:
  swan:
    environment:
      SWAN_PUBLIC_CRAWLERS: http://reference-relay:2470
    command:
      - serve
      - --host
      - "0.0.0.0"
      - --port
      - "3000"
      - --public-url
      - "https://swan.test"
      - --profile
      - /usr/local/share/swan/Profiles/permissioned-data-0016-2026-11-12.json
      - --data-directory
      - /var/lib/swan/data
      - --enable-local-space-interop
      - --space-account-kek-file
      - /run/secrets/swan-runtime/account-kek
      - --space-account-kek-id
      - primary
      - --enable-public-repository-mutations
      - --public-account-kek-file
      - /run/secrets/swan-runtime/account-kek
      - --public-account-kek-id
      - primary
      - --management-port
      - "3001"
      - --management-operator-secret-file
      - /run/secrets/swan-operator/operator-secret
      - --enable-management-plc-provisioning
      - --enable-management-firehose-sync
      - --management-account-kek-file
      - /run/secrets/swan-runtime/account-kek
      - --management-account-kek-id
      - primary
      - --enable-public-firehose
      - --oauth-server-key-file
      - /run/secrets/swan-runtime/oauth-server-key
      - --enable-oauth-authorization-server
      - --oauth-allow-localhost-development-client
      - --login-trusted-proxy-peer
      - "172.30.0.2"
      - --notification-config
      - /etc/swan/interop/notification-config.json
      - --enable-notification-delivery
      - --managing-service-audience
      - did:web:interop-swan-managing-service
      - --enable-email-recovery
      - --email-proof-key-file
      - /run/secrets/swan-runtime/email-proof-key
      - --email-sender
      - no-reply@swan.local
      - --email-smtp-host
      - mailpit
      - --email-smtp-port
      - "1025"
    # Compose merges service volume lists by mount target, so the base file's
    # data, runtime-secret, and notification-config mounts are still present.
    # This is the only mount of the operator secret anywhere in the laboratory,
    # and it exists only in the one overlay that passes `--management-port`.
    volumes:
      - swan-operator-secrets:/run/secrets/swan-operator:ro

  caddy:
    build:
      context: .
      dockerfile: interop/Dockerfile.caddy.reference-relay
    networks:
      swan:
        aliases:
          - relay.test

  toxiproxy:
    build:
      context: .
      dockerfile: interop/Dockerfile.toxiproxy.reference-relay

  toxiproxy-setup:
    command:
      - /bin/sh
      - -ec
      - |
        until curl --fail --silent http://toxiproxy:8474/version >/dev/null; do sleep 1; done
        curl --fail --silent --show-error -X POST http://toxiproxy:8474/proxies \
          -H 'Content-Type: application/json' \
          --data '{"name":"reference-pds","listen":"0.0.0.0:8666","upstream":"reference-pds:3000","enabled":true}' \
          || curl --fail --silent http://toxiproxy:8474/proxies/reference-pds >/dev/null
        curl --fail --silent --show-error -X POST http://toxiproxy:8474/proxies \
          -H 'Content-Type: application/json' \
          --data '{"name":"reference-relay-swan","listen":"0.0.0.0:443","upstream":"caddy:443","enabled":true}' \
          || curl --fail --silent http://toxiproxy:8474/proxies/reference-relay-swan >/dev/null

  reference-relay:
    build:
      context: .
      dockerfile: interop/Dockerfile.reference-relay
    environment:
      RELAY_PLC_HOST: http://reference-plc:2582
      SSL_CERT_FILE: /etc/ssl/certs/caddy-local-root.crt
    volumes:
      - reference-relay-data:/data
      - caddy-trust:/etc/ssl/certs:ro
    extra_hosts:
      - "swan.test:172.30.0.8"
    networks:
      swan: {}
    depends_on:
      caddy-ca-ready:
        condition: service_completed_successfully
      reference-plc:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/reference-relay-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 24

volumes:
  reference-relay-data:
